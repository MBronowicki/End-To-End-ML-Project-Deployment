[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.9"
name = "mlproject"
version = "0.0.1"
description = "End-to-End Machine Learning Project for production"
readme = "README.md"
authors = [
    {name = "Mariusz Bronowicki", email = "m.bronowicki@hotmail.com"}
]

dependencies = [
    "numpy==2.0.2",
    "pandas==2.3.3",
    "seaborn==0.13.2",
    "scikit-learn==1.8.0",
    "catboost==1.2.8",
    "xgboost==3.1.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "jupyter"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
# Automatically find packages under src/
where = ["src"]